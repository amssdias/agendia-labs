<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agendia Labs</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0B1120" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Keep in sync with LOCALES and DEFAULT_LOCALE in src/site.ts.
      (function () {
        var supported = ['en', 'es'];
        var preferred = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
        var match = 'en';
        for (var i = 0; i < preferred.length; i++) {
          var lang = String(preferred[i]).slice(0, 2).toLowerCase();
          if (supported.indexOf(lang) !== -1) { match = lang; break; }
        }
        // Relative, so it also works when the site is served from a subpath.
        location.replace(match + '/' + location.hash);
      })();
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B1120; color: #FFFFFF; font-family: system-ui, sans-serif; }
      nav { display: flex; gap: 12px; }
      a { color: #FFFFFF; padding: 12px 20px; border: 1px solid rgba(148, 163, 184, 0.3); border-radius: 999px; text-decoration: none; }
    </style>
  </head>
  <body>
    <nav aria-label="Language">
      <a href="en/" hreflang="en" lang="en">English</a>
      <a href="es/" hreflang="es" lang="es">Español</a>
    </nav>
  </body>
</html>
